<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FlightOps Clock V4</title>

<style>
body {
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system;
    overflow:hidden;
}

/* CLOCK MODE */
#clock {
    font-size:45vh;
    text-align:center;
    margin-top:12vh;
    font-weight:800;
}

/* FLIGHT PANEL */
#flight {
    display:none;
    padding:20px;
    box-sizing:border-box;
}

.row {
    display:flex;
    justify-content:space-between;
    padding:18px;
    border-bottom:1px solid #222;
}

.box {
    width:32%;
}

.label {
    font-size:12px;
    color:#888;
}

.value {
    font-size:20px;
    font-weight:bold;
}

#weather {
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:20px;
    box-sizing:border-box;
    border-top:1px solid #222;
}

.small {
    font-size:14px;
    color:#aaa;
}

.state {
    color:#34c759;
}

.warn {
    color:#ff9500;
}

.danger {
    color:#ff3b30;
}
</style>
</head>

<body>

<div id="clock">--:--</div>

<div id="flight">

    <div class="row">
        <div class="box">
            <div class="label">FLIGHT</div>
            <div id="flightNo" class="value">---</div>
        </div>

        <div class="box">
            <div class="label">ROUTE</div>
            <div id="route" class="value">---</div>
        </div>

        <div class="box">
            <div class="label">PICKUP</div>
            <div id="pickup" class="value">---</div>
        </div>
    </div>

    <div class="row">
        <div class="box">
            <div class="label">STATUS</div>
            <div id="status" class="value state">SCHEDULED</div>
        </div>

        <div class="box">
            <div class="label">DEP WEATHER</div>
            <div id="depW" class="value">---</div>
        </div>

        <div class="box">
            <div class="label">ARR WEATHER</div>
            <div id="arrW" class="value">---</div>
        </div>
    </div>

</div>

<div id="weather">
    <div class="small">Dubai System Clock Dashboard</div>
    <div class="small" id="dxbWeather">DXB --°</div>
</div>

<script>

/* =========================
CONFIG
========================= */
const GAS_URL = "YOUR_GOOGLE_SCRIPT_URL";

/* DXB */
const DXB = { lat:25.25, lon:55.36 };

/* =========================
API LAYER
========================= */
const API = {

async getFlight() {
    const r = await fetch(GAS_URL);
    return await r.json();
},

async weather(lat, lon) {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    return await r.json();
},

async liveFlight(code) {
    try {
        const r = await fetch(`https://api.opensky-network.org/api/states/all?callsign=${code}`);
        return await r.json();
    } catch(e) {
        return null;
    }
}

};

/* =========================
ENGINE
========================= */

const Engine = {

pickup(std) {
    return new Date(new Date(std).getTime() - 135*60000);
},

state(radar) {
    if(!radar || !radar.states) return "SCHEDULED";

    const s = radar.states[0];
    const alt = s[7];

    if(!alt) return "GROUND";
    if(alt < 1000) return "TAKEOFF";
    if(alt < 30000) return "CLIMB";
    return "CRUISE";
}

};

/* =========================
RENDER CLOCK
========================= */

function renderClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    document.getElementById("clock").innerText = `${h}:${m}`;
}

/* =========================
MAIN LOOP
========================= */

async function update() {

renderClock();

const dxb = await API.weather(DXB.lat, DXB.lon);
document.getElementById("dxbWeather").innerText =
"DXB " + Math.round(dxb.current_weather.temperature) + "°";

const flight = await API.getFlight();

if(!flight || !flight.hasFlight) {
    document.getElementById("flight").style.display = "none";
    return;
}

/* FLIGHT MODE */
document.getElementById("flight").style.display = "block";

document.getElementById("flightNo").innerText = flight.flightNo;
document.getElementById("route").innerText = flight.origin + " → " + flight.dest;

/* PICKUP */
const pickup = Engine.pickup(flight.std);
document.getElementById("pickup").innerText =
pickup.getHours().toString().padStart(2,'0') + ":" +
pickup.getMinutes().toString().padStart(2,'0');

/* WEATHER */
const dep = await API.weather(25.25,55.36);
const arr = await API.weather(14.67,-17.07);

document.getElementById("depW").innerText =
Math.round(dep.current_weather.temperature) + "°";

document.getElementById("arrW").innerText =
Math.round(arr.current_weather.temperature) + "°";

/* LIVE STATE */
const live = await API.liveFlight("UAE" + flight.flightNo);

const st = Engine.state(live);

const el = document.getElementById("status");

el.innerText = st;

el.className = "value";

if(st === "CRUISE") el.classList.add("state");
if(st === "CLIMB") el.classList.add("warn");
if(st === "TAKEOFF") el.classList.add("danger");

}

/* LOOP */
update();
setInterval(update, 30000);
setInterval(renderClock, 1000);

</script>

</body>
</html>
