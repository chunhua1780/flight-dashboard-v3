<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FlightOps V5</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system;
    overflow:hidden;
}

/* CLOCK MODE */
#clock{
    font-size:45vh;
    text-align:center;
    margin-top:12vh;
    font-weight:800;
}

/* FLIGHT MODE */
#flight{
    display:none;
    padding:18px;
    box-sizing:border-box;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:18px;
    border-bottom:1px solid #222;
}

.box{
    width:32%;
}

.label{
    font-size:12px;
    color:#888;
}

.value{
    font-size:20px;
    font-weight:bold;
}

#status{
    font-size:18px;
}

.green{color:#34c759;}
.orange{color:#ff9500;}
.red{color:#ff3b30;}

#footer{
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:15px;
    font-size:12px;
    color:#777;
    border-top:1px solid #222;
}
</style>
</head>

<body>

<div id="clock">--:--</div>

<div id="flight">

    <div class="row">
        <div class="box">
            <div class="label">FLIGHT</div>
            <div id="flightNo" class="value">---</div>
        </div>

        <div class="box">
            <div class="label">ROUTE</div>
            <div id="route" class="value">---</div>
        </div>

        <div class="box">
            <div class="label">PICKUP (REAL)</div>
            <div id="pickup" class="value">---</div>
        </div>
    </div>

    <div class="row">
        <div class="box">
            <div class="label">STATUS</div>
            <div id="status" class="value">SCHEDULED</div>
        </div>

        <div class="box">
            <div class="label">DEP TEMP</div>
            <div id="dep" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">ARR TEMP</div>
            <div id="arr" class="value">--</div>
        </div>
    </div>

</div>

<div id="footer">
    <div>DXB CLOCK OPS SYSTEM</div>
    <div id="dxbTemp">DXB --°</div>
</div>

<script>

/* =========================
CONFIG
========================= */

const GAS_URL = "YOUR_GOOGLE_SCRIPT_URL";

/* =========================
API LAYER
========================= */

const API = {

async calendar(){
    const r = await fetch(GAS_URL);
    return await r.json();
},

async weather(lat,lon){
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
    return await r.json();
},

async radar(code){
    try{
        const r = await fetch(`https://api.opensky-network.org/api/states/all?callsign=${code}`);
        return await r.json();
    }catch(e){
        return null;
    }
}

};

/* =========================
ENGINE
========================= */

const Engine = {

normalize(no){

    if(!no) return null;

    let n = no.toString().replace(/\D/g,"");

    // 8757 → fallback logic
    if(n.length === 4 && n.startsWith("8")){
        return {
            primary: n,
            fallback: n.substring(1)
        };
    }

    return {
        primary: n,
        fallback: null
    };
},

pickup(std){
    return new Date(new Date(std).getTime() - 135*60000);
},

state(radar){

    if(!radar || !radar.states) return "SCHEDULED";

    let s = radar.states[0];
    let alt = s[7];

    if(!alt) return "GROUND";
    if(alt < 1000) return "TAKEOFF";
    if(alt < 30000) return "CLIMB";
    return "CRUISE";
}

};

/* =========================
CLOCK
========================= */

function renderClock(){
    let now = new Date();
    document.getElementById("clock").innerText =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');
}

/* =========================
MAIN LOOP
========================= */

async function update(){

renderClock();

/* DXB WEATHER */
let dxb = await API.weather(25.25,55.36);
document.getElementById("dxbTemp").innerText =
"DXB " + Math.round(dxb.current_weather.temperature) + "°";

/* CALENDAR */
let data = await API.calendar();

if(!data || !data.hasFlight){
    document.getElementById("flight").style.display="none";
    return;
}

document.getElementById("flight").style.display="block";

/* NORMALIZE FLIGHT */
let norm = Engine.normalize(data.flightNo);

/* radar priority */
let radar = await API.radar("UAE"+norm.primary);

if(!radar || !radar.states || radar.states.length===0){

    radar = await API.radar("UAE"+norm.fallback);

}

let realSTD = data.std;

/* override STD if radar exists */
if(radar && radar.states && radar.states.length>0){
    // fallback: still use calendar but mark real-time active
    document.getElementById("status").innerText = "LIVE OPS";
    document.getElementById("status").className = "value green";
}else{
    document.getElementById("status").innerText = "SCHEDULED";
    document.getElementById("status").className = "value orange";
}

/* UI */
document.getElementById("flightNo").innerText = data.flightNo;
document.getElementById("route").innerText = data.origin + " → " + data.dest;

/* PICKUP based on REAL STD */
let pickup = Engine.pickup(realSTD);
document.getElementById("pickup").innerText =
pickup.getHours().toString().padStart(2,'0') + ":" +
pickup.getMinutes().toString().padStart(2,'0');

/* WEATHER */
let dep = await API.weather(25.25,55.36);
let arr = await API.weather(14.67,-17.07);

document.getElementById("dep").innerText =
Math.round(dep.current_weather.temperature) + "°";

document.getElementById("arr").innerText =
Math.round(arr.current_weather.temperature) + "°";

}

/* LOOP */
update();
setInterval(update,30000);
setInterval(renderClock,1000);

</script>

</body>
</html>
