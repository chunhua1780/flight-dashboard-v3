<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>777 Captain Dashboard v3</title>

<style>
:root {
    --bg:#000;
    --gold:#c1a35f;
    --text:#fff;
    --gray:#1a1a1a;
    --red:#ff3b30;
    --green:#34c759;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "SF Pro Display", sans-serif;
    overflow:hidden;
    height:100vh;
}

/* HUD */
#hud-top {
    height:26vh;
    display:none;
    padding:1.5vh 2vw;
    background:#050505;
    border-bottom:2px solid var(--gray);
    box-sizing:border-box;
}

.flight-active #hud-top {
    display:grid;
    grid-template-columns:1.2fr 1fr 1.2fr;
    gap:20px;
}

/* MAIN */
#main-display {
    height:100vh;
    display:flex;
}

.flight-active #main-display {
    height:74vh;
}

#clock-zone {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

#main-clock {
    font-size:52vh;
    font-weight:900;
}

.flight-active #main-clock {
    font-size:30vh;
}

.hud-cell {
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.label {
    font-size:1.4vh;
    color:#777;
}

.val {
    font-size:4vh;
    font-weight:900;
    color:var(--gold);
}

.pickup-box {
    background:var(--gold);
    color:#000;
    padding:6px 12px;
    border-radius:8px;
    font-weight:900;
    display:inline-block;
    margin-top:8px;
}

.corner {
    position:absolute;
    padding:25px;
}

.weather-huge {
    font-size:10vh;
    color:var(--gold);
}

/* Screensaver */
.screensaver #hud-top { opacity:0; }
.screensaver #main-clock { font-size:60vh; opacity:0.9; }
</style>
</head>

<body>

<div id="hud-top">
    <div class="hud-cell">
        <div class="label">Flight</div>
        <div id="mission-id" class="val">--</div>
        <div id="pickup-val" class="pickup-box">PICKUP --</div>
    </div>

    <div class="hud-cell" style="text-align:center;">
        <div id="dest-temp" class="val">--°</div>
        <div id="clothing-info">--</div>
    </div>

    <div class="hud-cell" style="text-align:right;">
        <div class="label">STATUS</div>
        <div id="notam-brief">SYNC...</div>
        <div id="live-status">● READY</div>
    </div>
</div>

<div id="main-display">
    <div id="clock-zone">
        <div class="corner" style="top:0;left:0;">
            <div id="date-val"></div>
            <div id="day-val"></div>
        </div>

        <div class="corner" style="top:0;right:0;text-align:right;">
            <div id="dxb-temp" class="weather-huge">--</div>
        </div>

        <div id="main-clock">00:00</div>
    </div>
</div>

<script>

// ================= CONFIG =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbxSmqqVM38ZuCrrzwcm1E7179zwvAi5qjhEzaq4mXhwCOeczDP8CB2Nx7hw7zAFcqWU/exec";

// 🔴 你要改这里
const CALENDAR_ICS_URL = "https://script.google.com/macros/s/AKfycbz1iR3ELklG4f2LVM8O3pA8LKK_Q641MizOPowcJQXP6WFVOxptt35h4QGjsG9nfwwS/exec";

const AIRPORTS = {
    DXB:{lat:25.25,lon:55.36,tz:4},
    CKY:{lat:9.57,lon:-13.61,tz:0},
    DSS:{lat:14.67,lon:-17.07,tz:0}
};

// ================= UTIL =================
async function safeFetch(url){
    try{
        const r = await fetch(url);
        return await r.json();
    }catch(e){return null;}
}

// ================= CALENDAR =================
async function fetchCalendar(){
    try{
        const r = await fetch(CALENDAR_ICS_URL);
        const t = await r.text();
        return parseICS(t);
    }catch(e){return [];}
}

function parseICS(data){
    const lines=data.split("\n");
    let ev=null,res=[];
    for(let l of lines){
        if(l.includes("BEGIN:VEVENT")) ev={};
        if(ev){
            if(l.startsWith("SUMMARY:")) ev.title=l.replace("SUMMARY:","");
            if(l.startsWith("DTSTART")) ev.start=parseTime(l);
        }
        if(l.includes("END:VEVENT")) res.push(ev);
    }
    return res;
}

function parseTime(l){
    const m=l.match(/:(\d{8}T\d{6})/);
    if(!m) return null;
    const t=m[1];
    return new Date(
        t.slice(0,4),
        t.slice(4,6)-1,
        t.slice(6,8),
        t.slice(9,11),
        t.slice(11,13)
    );
}

// ================= STATE =================
function getState(f,now){
    if(!f?.hasFlight) return "GROUND";
    const std=new Date(f.std);
    const dep=std.getTime()-135*60000;
    if(now>=dep && now<=std.getTime()+8*3600000) return "FLIGHT";
    return "LAYOVER";
}

// ================= MAIN =================
async function update(){

    const now=new Date();

    document.getElementById("main-clock").innerText=
        now.getHours().toString().padStart(2,"0")+":"+
        now.getMinutes().toString().padStart(2,"0");

    document.getElementById("date-val").innerText=
        now.getDate();

    const f=await safeFetch(GAS_URL);
    const cal=await fetchCalendar();

    const state=getState(f,now);

    if(state==="GROUND"){
        document.body.classList.remove("flight-active");
        document.getElementById("live-status").innerText="● GROUND";
    }

    if(state==="LAYOVER"){
        document.body.classList.add("flight-active");
        document.getElementById("mission-id").innerText="LAYOVER";
        document.getElementById("notam-brief").innerText="CREW REST / NEXT FLIGHT PREP";
    }

    if(state==="FLIGHT"){
        document.body.classList.add("flight-active");
        document.getElementById("mission-id").innerText=f.flightNo||"--";
        document.getElementById("notam-brief").innerText="FLIGHT ACTIVE";
    }

    // DXB weather
    const w=await safeFetch(
        "https://api.open-meteo.com/v1/forecast?latitude=25.25&longitude=55.36&current_weather=true"
    );

    if(w?.current_weather){
        document.getElementById("dxb-temp").innerText=
            Math.round(w.current_weather.temperature)+"°";
    }
}

// ================= SCREENSAVER =================
let last=Date.now();
document.addEventListener("touchstart",()=>last=Date.now());

setInterval(()=>{
    if(Date.now()-last>60000){
        document.body.classList.add("screensaver");
    }else{
        document.body.classList.remove("screensaver");
    }
},5000);

// ================= START =================
update();
setInterval(update,30000);

</script>
</body>
</html>
