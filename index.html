<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>777 Captain Dashboard v3</title>

<style>
:root {
    --bg:#000;
    --gold:#c1a35f;
    --text:#fff;
    --gray:#1a1a1a;
    --red:#ff3b30;
    --green:#34c759;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"SF Pro Display",sans-serif;
    overflow:hidden;
    height:100vh;
}

/* HUD */
#hud-top {
    height:26vh;
    display:none;
    padding:1.5vh 2vw;
    background:#050505;
    border-bottom:2px solid var(--gray);
    box-sizing:border-box;
}

.flight-active #hud-top {
    display:grid;
    grid-template-columns:1.2fr 1fr 1.2fr;
    gap:20px;
}

/* MAIN */
#main-display {
    height:100vh;
    display:flex;
}

.flight-active #main-display {
    height:74vh;
}

#clock-zone {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

#main-clock {
    font-size:52vh;
    font-weight:900;
}

.flight-active #main-clock {
    font-size:30vh;
}

.hud-cell {
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.val {
    font-size:4vh;
    font-weight:900;
    color:var(--gold);
}

.label {
    font-size:1.4vh;
    color:#777;
}

.corner {
    position:absolute;
    padding:25px;
}

.weather {
    font-size:10vh;
    color:var(--gold);
}

.screensaver #hud-top { opacity:0; }
.screensaver #main-clock { font-size:60vh; opacity:0.9; }
</style>
</head>

<body>

<div id="hud-top">

    <div class="hud-cell">
        <div class="label">FLIGHT</div>
        <div id="mission-id" class="val">--</div>
        <div id="pickup-val" style="font-size:2vh;color:#aaa;">--</div>
    </div>

    <div class="hud-cell" style="text-align:center;">
        <div id="dest-icon" style="font-size:6vh;">☀️</div>
        <div id="dest-temp" class="val">--°</div>
    </div>

    <div class="hud-cell" style="text-align:right;">
        <div class="label">STATUS</div>
        <div id="notam-brief">SYNC...</div>
        <div id="live-status">● READY</div>
    </div>

</div>

<div id="main-display">
    <div id="clock-zone">

        <div class="corner" style="top:0;left:0;">
            <div id="date-val"></div>
            <div id="day-val"></div>
        </div>

        <div class="corner" style="top:0;right:0;text-align:right;">
            <div id="dxb-icon" class="weather">☀️</div>
            <div id="dxb-temp" style="font-size:3vh;">--°</div>
        </div>

        <div id="main-clock">00:00</div>
    </div>
</div>

<script>

// ================= CONFIG =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbxSmqqVM38ZuCrrzwcm1E7179zwvAi5qjhEzaq4mXhwCOeczDP8CB2Nx7hw7zAFcqWU/exec";
const CALENDAR_ICS_URL = ""; // 可选

// ================= WEATHER ICON =================
function getWeatherIcon(code) {

    if (code === 0) return "☀️";
    if (code <= 2) return "🌤️";
    if (code <= 3) return "☁️";

    if (code >= 45 && code <= 48) return "🌫️";
    if (code >= 51 && code <= 67) return "🌧️";
    if (code >= 71 && code <= 77) return "🌨️";
    if (code >= 80 && code <= 82) return "🌦️";

    if (code >= 95) return "⛈️";

    return "🌡️";
}

// ================= SAFE FETCH =================
async function safeFetch(url){
    try{
        const r = await fetch(url);
        return await r.json();
    }catch(e){return null;}
}

// ================= MAIN UPDATE =================
async function update(){

    const now = new Date();

    document.getElementById("main-clock").innerText =
        now.getHours().toString().padStart(2,"0")+":"+
        now.getMinutes().toString().padStart(2,"0");

    const months=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    document.getElementById("date-val").innerText =
        now.getDate()+" "+months[now.getMonth()];

    document.getElementById("day-val").innerText =
        ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"][now.getDay()];

    // ================= DXB WEATHER =================
    const w = await safeFetch(
        "https://api.open-meteo.com/v1/forecast?latitude=25.25&longitude=55.36&current_weather=true"
    );

    if(w?.current_weather){
        const temp = Math.round(w.current_weather.temperature);
        const code = w.current_weather.weathercode;

        document.getElementById("dxb-temp").innerText = temp + "°";
        document.getElementById("dxb-icon").innerText = getWeatherIcon(code);
    }

    // ================= FLIGHT =================
    const f = await safeFetch(GAS_URL);

    if(f?.hasFlight){
        document.body.classList.add("flight-active");

        document.getElementById("mission-id").innerText =
            "EK " + (f.flightNo || "--");

        document.getElementById("notam-brief").innerText =
            "FLIGHT ACTIVE";

        document.getElementById("live-status").innerText =
            "● OPS ACTIVE";

        document.getElementById("live-status").style.color = "#34c759";

    } else {
        document.body.classList.remove("flight-active");

        document.getElementById("live-status").innerText =
            "● GROUND MODE";

        document.getElementById("notam-brief").innerText =
            "NO ACTIVE FLIGHT";
    }
}

// ================= SCREENSAVER =================
let lastTouch = Date.now();

document.addEventListener("touchstart",()=>lastTouch=Date.now());
document.addEventListener("mousemove",()=>lastTouch=Date.now());

setInterval(()=>{
    if(Date.now()-lastTouch>60000){
        document.body.classList.add("screensaver");
    }else{
        document.body.classList.remove("screensaver");
    }
},5000);

// ================= START =================
update();
setInterval(update,30000);

</script>

</body>
</html>
